name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Sem o Chromium os testes de integração do scraper seriam pulados em silêncio.
      - run: npx playwright-core install --with-deps chromium
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: Teste de ponta a ponta (navegador)
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      - name: Sobe a pilha (api + web + portal mock)
        run: |
          npm run seed
          npm run dev > dev.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fs http://localhost:3001/api/health > /dev/null && curl -fs http://localhost:5173 > /dev/null && curl -fs http://localhost:4010/login > /dev/null; then
              echo "pilha no ar"; exit 0
            fi
            sleep 2
          done
          echo "a pilha não subiu a tempo"; cat dev.log; exit 1
      - run: npm run e2e
        env:
          FAIL_DIR: ${{ runner.temp }}
      - name: Anexa log e capturas de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-falha
          path: |
            dev.log
            ${{ runner.temp }}/e2e-fail-*.png
          if-no-files-found: ignore
